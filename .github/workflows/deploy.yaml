name: Deployment Workflow

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.17.0'

      - name: Install dependencies
        run: npm install


      - name: SSH Deploy
        uses: appleboy/ssh-action@v0.1.0
        with:
          host: ${{ secrets.HOST }} 
          username: ${{ secrets.USERNAME }} 
          key: ${{ secrets.SSH_PRIVATE_KEY }} 
          script: |
            echo "Starting deployment..."
            cd /var/application/mainCode-NodeJs-SQL
            echo "Pulling latest code..."
             git pull origin main
            echo "Installing dependencies..."
             npm install  # Make sure dependencies are installed
            
            # Check if app is running with PM2
            if pm2 list | grep -q "syscon-node-sql"; then
              echo "App is already running, restarting with PM2..."
               pm2 restart syscon-node-sql  # Restart the PM2 process
            else
              echo "App not running, starting with PM2..."
              pm2 start npm --name "syscon-node-sql" -- run start  # Start with PM2
            fi
            
            echo "Deployment complete."
